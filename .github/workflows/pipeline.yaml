name: CI/CD Pipeline

on:
  push:
    tags:
      - 'check'
      - 'deploy'

jobs:
  lint-branch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Check branch name
        run: |
          BRANCH_NAME="${{ github.ref_name }}"
          BRANCH_REGEX="^(feat|fix|chore|test)/.+$"
          
          if [[ "$BRANCH_NAME" != "main" && "$BRANCH_NAME" != "dev" ]]; then
            if [[ ! "$BRANCH_NAME" =~ $BRANCH_REGEX ]]; then
              echo "Invalid branch name: '$BRANCH_NAME'"
              echo "Expected format: type/name (allowed types: feat, fix, chore, test)"
              exit 1
            fi
            echo "Branch name is valid."
          else
            echo "Branch validation skipped for main/dev."
          fi

  lint-commit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Check commit message
        run: |
          LAST_COMMIT="${{ github.event.head_commit.message }}"
          COMMIT_REGEX="^(feat|fix|chore|test)\(.+\): .+$"
          
          if [[ "$LAST_COMMIT" =~ $COMMIT_REGEX ]]; then
            echo "Commit format is valid."
          else
            echo "Commit format is invalid."
            echo "Expected format: type(scope): message (allowed types: feat, fix, chore, test)"
            exit 1
          fi

  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - run: |
          npm install
          npm run build

  deploy:
    needs: [lint-branch, lint-commit, build]
    runs-on: ubuntu-latest
    if: github.ref == 'refs/tags/deploy'

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: EndBug/add-and-commit@v9
        with:
          default_author: github_actions
          message: 'chore(cd): sync branch to main via deploy tag [skip ci]'
          new_branch: main