name: CI/CD Pipeline

on:
  push:
    branches:
      - '**'
    tags:
      - 'deploy'

jobs:
  ci:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Build
        run: |
          npm install
          npm run build

  cd:
    needs: ci
    runs-on: ubuntu-latest
    if: github.ref == 'refs/tags/deploy'

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Push code to main
        uses: EndBug/add-and-commit@v9
        with:
          default_author: github_actions
          message: 'chore: sync branch to main via deploy tag'
          new_branch: main